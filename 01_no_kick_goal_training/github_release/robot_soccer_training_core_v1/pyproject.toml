[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-soccer-training-core"
version = "0.1.0"
description = "No-Kick recurrent high-policy training for Go2 robot soccer"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src", "runtime_project/isaac_go2_low_level_rl"]
include = ["robot_soccer*", "isaac_go2_low_level_rl*"]
